name: publish_pom

on:
  push:
    branches:
      - main
      - release
    paths:
      - "**/pom.xml"
      - ".github/workflows/*_pom.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: ./.github/workflows/maven-publish.yml
    with:
        cmd: mvn -B verify package
        publish_site: false
