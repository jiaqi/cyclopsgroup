site_name: Jiaqi Guo
site_dir: target
theme:
  name: readthedocs
  custom_dir: theme
markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - codehilite:
      linenums: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
plugins:
  - mermaid2
extra_css:
  - https://fonts.googleapis.com/icon?family=Material+Icons
  - https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.1.0/dist/cookieconsent.css
  - css/page_layout.css
  - css/markdown_styles.css
extra_javascript:
  - https://code.jquery.com/jquery-3.7.1.min.js
  - js/main.js
  - https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.1.0/dist/cookieconsent.umd.js
  - js/cookieconsent_config.js
